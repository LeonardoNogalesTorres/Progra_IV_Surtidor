<!DOCTYPE html>
<html lang="es" class="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BomboClap | Panel de Alertas</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
</head>
<body class="bg-[#f6faff] text-[#171c20]">
  <div class="flex">
    <aside id="sidebar-container"></aside>

    <main class="ml-[260px] flex-1 min-h-screen p-6">
      <h1 class="text-2xl font-bold mb-6">Panel de Alertas Críticas</h1>

      <div id="banner-alerta-critica" class="hidden bg-red-100 text-red-900 p-4 rounded-2xl border-l-8 border-red-600 mb-6">
        <h3 class="font-bold">¡ATENCIÓN: NIVEL CRÍTICO EN SURTIDORES!</h3>
        <p class="text-xs mt-1">Existen tanques por debajo del 15% de su capacidad total.</p>
      </div>

      <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
        <table class="w-full text-left border-collapse">
          <thead class="bg-slate-100 text-xs font-semibold text-slate-600 uppercase border-b border-slate-200">
            <tr>
              <th class="p-4">Surtidor</th>
              <th class="p-4">Tipo de Alerta</th>
              <th class="p-4">Fecha / Hora</th>
              <th class="p-4">Estado</th>
              <th class="p-4 text-right">Acción</th>
            </tr>
          </thead>
          <tbody id="tabla-alertas-body" class="divide-y divide-slate-200 text-sm"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script type="module" src="js/controllers/AlertasController.js"></script>
</body>
</html>
