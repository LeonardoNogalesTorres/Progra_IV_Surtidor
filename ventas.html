<!DOCTYPE html>
<html lang="es" class="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BomboClap | Comprar Combustible</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
</head>
<body class="bg-[#f6faff] text-[#171c20]">
  <div class="flex">
    <aside id="sidebar-container"></aside>

    <main class="ml-[260px] flex-1 min-h-screen p-6">
      <h1 class="text-2xl font-bold mb-6">Registro y Compra de Combustible</h1>

      <div class="grid grid-cols-12 gap-6 max-w-7xl">
        <!-- Formulario -->
        <div class="col-span-12 lg:col-span-7 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
          <form id="form-venta" class="space-y-5">
            <div>
              <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Seleccionar Surtidor</label>
              <select id="select-surtidor" class="w-full border border-slate-300 rounded-xl p-3 font-semibold text-sm bg-white"></select>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Combustible</label>
                <input id="input-combustible" type="text" class="w-full bg-slate-100 border border-slate-200 rounded-xl p-3 font-bold text-slate-700 text-sm" readonly/>
              </div>
              <div>
                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Precio por Litro</label>
                <input id="input-precio-unitario" type="text" class="w-full bg-slate-100 border border-slate-200 rounded-xl p-3 font-bold text-slate-700 text-sm" readonly/>
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Litros a Cargar</label>
              <input id="input-litros" type="number" step="0.5" min="1" value="10.00" class="w-full text-3xl font-black text-center border border-slate-300 rounded-xl p-4 focus:ring-2 focus:ring-sky-500 outline-none"/>
            </div>

            <button type="submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-sky-600/20 flex items-center justify-center gap-2">
              <span class="material-symbols-outlined">shopping_cart</span>
              <span>Confirmar Compra</span>
            </button>
          </form>
        </div>

        <!-- Ticket Preview -->
        <div class="col-span-12 lg:col-span-5 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between font-mono">
          <div>
            <h2 class="text-center font-bold text-base border-b border-dashed pb-3 mb-4">RECIBO DE TRANSACCIÓN</h2>
            <div class="space-y-3 text-sm">
              <div class="flex justify-between"><span class="text-slate-500">Surtidor:</span><span id="ticket-surtidor" class="font-bold">#--</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Combustible:</span><span id="ticket-combustible" class="font-bold">--</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Litros:</span><span id="ticket-litros" class="font-bold">0.00 L</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Precio/L:</span><span id="ticket-precio" class="font-bold">$0.00</span></div>
              <div class="flex justify-between text-lg font-black border-t border-slate-900 pt-3 mt-3">
                <span>TOTAL A PAGAR:</span>
                <span id="ticket-total" class="text-sky-600">$0.00</span>
              </div>
            </div>
          </div>
          <p class="text-[10px] text-slate-400 text-center mt-6">El monto se descontará automáticamente del nivel del surtidor.</p>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="js/controllers/VentasController.js"></script>
</body>
</html>
